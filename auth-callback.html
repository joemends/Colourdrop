<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirming Account | Color Drop</title><link rel="stylesheet" href="css/style.css"><style>.callback{max-width:560px;margin:auto;text-align:center}.auth-status{display:none;margin-top:16px;padding:13px 15px;border-radius:10px;font-weight:600}.auth-status.show{display:block}.auth-status.error{background:#fff0f0;color:#b42318}.auth-status.success{background:#ecfdf3;color:#067647}.auth-status.info{background:#f5f0ff;color:#6b21a8}</style></head><body><section class="section"><div class="container callback"><div class="info-card"><div class="eyebrow">Account Verification</div><h1>Checking your<br><span style="color:var(--accent)">account.</span></h1><p id="text" style="margin-top:16px">Please wait while we complete authentication…</p><div id="status" class="auth-status" role="alert"></div><a id="link" class="btn primary" href="sign-in.html" style="display:none;margin-top:22px">Continue to Sign In</a></div></div></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/supabase-app.js"></script><script>(async()=>{const text=document.getElementById('text'),status=document.getElementById('status'),link=document.getElementById('link');try{const c=await initSupabase();if(!c)throw new Error('Supabase is not configured.');const {data,error}=await c.auth.getSession();if(error)throw error;if(data.session){text.textContent='Your account is confirmed. Redirecting to the admin dashboard…';status.textContent='Authentication successful.';status.className='auth-status show success';setTimeout(()=>location.replace('admin.html'),900)}else{ text.textContent='Your email may be confirmed. Please sign in to continue.';status.textContent='No active session was created.';status.className='auth-status show info';link.style.display='inline-flex'}}catch(e){console.error(e);text.textContent='We could not complete the authentication callback.';status.textContent=e.message||'Please try signing in again.';status.className='auth-status show error';link.style.display='inline-flex'}})();</script></body></html>
