<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signing Out | Color Drop</title><link rel="stylesheet" href="css/style.css"><style>.logout{max-width:560px;margin:auto;text-align:center}</style></head><body><main><section class="section"><div class="container logout"><div class="info-card"><div class="eyebrow">Account</div><h1>Signing you<br><span style="color:var(--accent)">out.</span></h1><p id="status" style="margin-top:16px">Please wait…</p></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/supabase-app.js"></script><script>(async()=>{const s=document.getElementById('status');try{const c=await initSupabase();if(c)await c.auth.signOut();s.textContent='You have been signed out. Redirecting to Sign In…'}catch(e){console.error(e);s.textContent='Your local session was cleared. Redirecting to Sign In…'}setTimeout(()=>location.replace('sign-in.html'),700)})();</script></body></html>
