<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1.0" name="viewport"/>
  <title>
   Sign In | Color Drop
  </title>
  <link href="css/style.css" rel="stylesheet"/>
  <style>
   .login-status{margin-top:14px;padding:12px 14px;border-radius:10px;display:none;font-weight:600}.login-status.error{display:block;background:#fff0f0;color:#b42318}.login-status.info{display:block;background:#f5f0ff;color:#6b21a8}.login-status.success{display:block;background:#ecfdf3;color:#067647}
  </style>
 </head>
 <body>
  <div class="topbar">
   <div class="container">
    <span>
     Branding &middot; Advertising &middot; Publishing
    </span>
    <span>
     +233 (0) 267 771 670
    </span>
   </div>
  </div>
  <header class="nav">
   <div class="container nav-inner">
    <a class="logo" href="index.html">
     <span class="logo-mark">
     </span>
     Color Drop
    </a>
    <button aria-label="Open menu" class="menu">
     ☰
    </button>
    <nav class="nav-links">
     <a href="index.html">
      Home
     </a>
     <a href="about.html">
      About
     </a>
     <a href="services.html">
      Services
     </a>
     <a href="publishing.html">
      Publishing
     </a>
     <a href="clientele.html">
      Clientele
     </a>
     <a href="contact.html">
      Contact
     </a>
     <a href="intake-forms.html">
      Intake Forms
     </a>
     <a href="sign-in.html">
      Sign In
     </a>
    </nav>
    <div class="nav-cta">
     <a class="btn primary" href="contact.html">
      Get a Quote
     </a>
    </div>
   </div>
  </header>
  <main>
   <section class="page-hero">
    <div class="container reveal">
     <div class="eyebrow">
      Admin Sign In
     </div>
     <h1>
      Welcome
      <br/>
      <span style="color:var(--accent)">
       back.
      </span>
     </h1>
     <p>
      Sign in with the administrator account created in Supabase.
     </p>
    </div>
   </section>
   <section class="section">
    <div class="container" style="max-width:560px">
     <div class="info-card reveal">
      <form id="login-form" novalidate="">
       <div class="field">
        <label for="login-email">
         Email
        </label>
        <input autocomplete="username" id="login-email" name="email" placeholder="you@example.com" required="" type="email"/>
       </div>
       <div class="field" style="margin-top:16px">
        <label for="login-password">
         Password
        </label>
        <input autocomplete="current-password" id="login-password" name="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required="" type="password"/>
       </div>
       <div aria-live="polite" class="login-status" id="login-status" role="alert">
       </div>
       <button class="btn primary" id="login-button" style="margin-top:24px;width:100%" type="submit">
        Sign in
       </button>
      </form>
     </div>
    </div>
   </section>
  </main>
  <footer class="footer">
   <div class="container footer-bottom">
    <span>
     &copy;
     <span data-year="">
     </span>
     Color Drop. All Rights Reserved.
    </span>
    <span>
     Secure admin portal
    </span>
   </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>
  <script src="supabase-config.js">
  </script>
  <script src="js/supabase-app.js">
  </script>
  <script>
   (async()=>{const form=document.getElementById('login-form'),status=document.getElementById('login-status'),button=document.getElementById('login-button');function msg(text,type){status.textContent=text;status.className='login-status '+type}form.addEventListener('submit',async e=>{e.preventDefault();msg('Signing in…','info');button.disabled=true;try{const email=document.getElementById('login-email').value.trim();const password=document.getElementById('login-password').value;if(!email||!password)throw new Error('Enter both your email and password.');if(!window.supabaseConfig?.url||!window.supabaseConfig?.anonKey)throw new Error('Supabase configuration is missing. Netlify did not generate the Supabase config. Redeploy after checking SUPABASE_URL and SUPABASE_ANON_KEY.');if(!window.supabase)throw new Error('Supabase library did not load. Check the internet/CDN connection.');const client=await initSupabase();if(!client)throw new Error('Supabase client could not be initialized.');const {data,error}=await client.auth.signInWithPassword({email,password});if(error)throw error;if(!data?.session)throw new Error('Login succeeded but no session was returned.');msg('Login successful. Opening admin dashboard…','success');window.location.replace('admin.html')}catch(err){console.error('Supabase login error:',err);msg(err?.message||'Sign-in failed. Check your email and password.','error');button.disabled=false}});const y=document.querySelector('[data-year]');if(y)y.textContent=new Date().getFullYear()})()
  </script>
 </body>
</html>
