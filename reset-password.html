<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | Color Drop</title><link href="css/style.css" rel="stylesheet"></head>
<body>
<div class="topbar"><div class="container"><span>Branding · Advertising · Publishing</span><span>+233 (0) 267 771 670</span></div></div>
<header class="nav"><div class="container nav-inner"><a class="logo" href="index.html"><span class="logo-mark"></span>Color Drop Impressions</a><button aria-label="Open menu" class="menu">☰</button><nav class="nav-links"><a href="index.html">Home</a><a href="about.html">About</a><a href="services.html">Services</a><a href="gallery.html">Gallery</a><a href="contact.html">Contact</a></nav><div class="nav-cta"><a class="btn primary" href="sign-in.html">Sign In</a></div></div></header>
<main><section class="page-hero"><div class="container reveal"><div class="eyebrow">Password Reset</div><h1>Choose a new<br><span style="color:var(--accent)">password.</span></h1><p>Set a new password for your Color Drop account.</p></div></section>
<section class="section"><div class="container" style="max-width:560px"><div class="info-card reveal"><form id="update-form"><div class="field"><label for="password">New password</label><input id="password" type="password" minlength="6" autocomplete="new-password" required placeholder="At least 6 characters"></div><div class="field" style="margin-top:16px"><label for="confirm">Confirm new password</label><input id="confirm" type="password" minlength="6" autocomplete="new-password" required placeholder="Repeat your password"></div><div class="login-status" id="status" role="alert" aria-live="polite"></div><button class="btn primary" id="button" style="margin-top:24px;width:100%" type="submit">Update password</button></form><a class="text-link" style="display:block;text-align:center;margin-top:14px" href="sign-in.html">Back to sign in</a></div></div></section></main>
<footer class="footer"><div class="container footer-bottom"><span>© <span data-year></span> Color Drop. All Rights Reserved.</span><span>Branding · Design · Print</span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/supabase-app.js"></script><script>
(async()=>{const form=document.getElementById('update-form'),status=document.getElementById('status'),button=document.getElementById('button');function msg(t,k){status.textContent=t;status.className='login-status '+k}const client=await initSupabase();if(!client){msg('Supabase configuration is missing.','error');button.disabled=true;return}const {data:{session}}=await client.auth.getSession();if(!session){msg('This password-reset link is missing or has expired. Request a new one from the sign-in page.','error');button.disabled=true;return}form.addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('password').value,c=document.getElementById('confirm').value;button.disabled=true;msg('Updating password…','info');try{if(p.length<6)throw new Error('Password must be at least 6 characters.');if(p!==c)throw new Error('Passwords do not match.');const {error}=await client.auth.updateUser({password:p});if(error)throw error;await client.auth.signOut();msg('Password updated successfully. You can now sign in with your new password.','success');form.reset();}catch(err){msg(err?.message||'Could not update your password.','error')}finally{button.disabled=false}});const y=document.querySelector('[data-year]');if(y)y.textContent=new Date().getFullYear()})();
</script></body></html>
