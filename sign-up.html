<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | Color Drop</title><link rel="stylesheet" href="css/style.css"><style>body{background:#f7f4fb}.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:30px}.auth-card{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:0 20px 60px rgba(0,0,0,.08)}.auth-logo{display:flex;align-items:center;gap:12px;font-weight:900;font-size:1.1rem;margin-bottom:30px}.auth-logo .logo-mark{width:42px;height:42px}.auth-card h1{font-size:2.5rem;margin-bottom:10px}.auth-card p{color:#666}.field{margin-top:18px}.field label{display:block;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:14px;border:1px solid var(--line);border-radius:10px;font:inherit}.auth-status{margin-top:16px;padding:12px 14px;border-radius:10px;display:none}.auth-status.show{display:block}.auth-status.error{background:#fff0f0;color:#b42318}.auth-status.success{background:#ecfdf3;color:#067647}.auth-links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px}.auth-links a{color:var(--primary);font-weight:700;text-decoration:none}.password-wrap{position:relative}.password-wrap input{padding-right:52px}.toggle-pass{position:absolute;right:8px;top:7px;border:0;background:transparent;padding:10px;cursor:pointer}</style></head><body><main class="auth-wrap"><section class="auth-card"><a class="auth-logo logo" href="index.html"><span class="logo-mark"></span><span data-site-name>Color Drop</span></a><div class="eyebrow">Create account</div><h1>Join Color Drop.</h1><p>Create an account with your email and password.</p><form id="form"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>Password</label><div class="password-wrap"><input id="password" type="password" minlength="6" autocomplete="new-password" required><button class="toggle-pass" type="button" data-target="password">Show</button></div></div><div class="field"><label>Confirm password</label><div class="password-wrap"><input id="confirm" type="password" minlength="6" autocomplete="new-password" required><button class="toggle-pass" type="button" data-target="confirm">Show</button></div></div><div id="status" class="auth-status" aria-live="polite"></div><button id="submit" class="btn primary" style="width:100%;margin-top:22px">Create account</button></form><div class="auth-links"><a href="sign-in.html">Already have an account? Sign in</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/supabase-app.js"></script><script>(async()=>{await initSupabase();await loadSiteBranding();document.querySelectorAll(".toggle-pass").forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.target);i.type=i.type==="password"?"text":"password";b.textContent=i.type==="password"?"Show":"Hide"});const f=document.getElementById("form"),st=document.getElementById("status"),btn=document.getElementById("submit");f.onsubmit=async e=>{e.preventDefault();btn.disabled=true;try{const email=emailEl().value.trim(),password=document.getElementById("password").value,confirm=document.getElementById("confirm").value;if(password.length<6)throw Error("Password must be at least 6 characters.");if(password!==confirm)throw Error("Passwords do not match.");const c=await initSupabase();if(!c)throw Error("Supabase is not configured.");const {data,error}=await c.auth.signUp({email,password,options:{emailRedirectTo:new URL("sign-in.html",location.href).href}});if(error)throw error;st.className="auth-status show success";st.textContent=data.session?"Account created. Redirecting…":"Account created. Check your email to confirm your account, then sign in.";if(data.session)setTimeout(()=>location.replace("admin.html"),700);else f.reset()}catch(err){st.className="auth-status show error";st.textContent=err.message||"Could not create account."}finally{btn.disabled=false}};function emailEl(){return document.getElementById("email")}})();</script></body></html>
