<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Verify Your Email | Color Drop</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body{background:#f7f4fb}
    .verify-wrap{min-height:100vh;display:grid;place-items:center;padding:30px}
    .verify-card{width:min(560px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:38px;box-shadow:0 20px 60px rgba(0,0,0,.08);text-align:center}
    .verify-icon{width:72px;height:72px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;background:#f5f0ff;color:#7d087f;font-size:32px}
    .verify-card h1{font-size:2.35rem;margin-bottom:12px}
    .verify-card p{color:#666;line-height:1.7}
    .email-box{margin:20px 0;padding:13px 16px;background:#f7f4fb;border-radius:12px;font-weight:800;word-break:break-word}
    .auth-status{margin-top:18px;padding:12px 14px;border-radius:10px;display:none;text-align:left;font-weight:600}
    .auth-status.show{display:block}.auth-status.error{background:#fff0f0;color:#b42318}.auth-status.success{background:#ecfdf3;color:#067647}.auth-status.info{background:#f5f0ff;color:#6b21a8}
    .verify-actions{display:grid;gap:10px;margin-top:22px}
    .text-link{display:inline-block;margin-top:18px;color:var(--primary);font-weight:700;text-decoration:none}
    .timer{font-size:.9rem;color:#777;margin-top:10px}
  </style>
</head>
<body>
<main class="verify-wrap">
  <section class="verify-card">
    <a class="auth-logo logo" href="index.html" style="display:flex;justify-content:center;align-items:center;gap:12px;font-weight:900;font-size:1.1rem;text-decoration:none;color:inherit;margin-bottom:28px">
      <span class="logo-mark" style="width:42px;height:42px"></span>
      <span data-site-name>Color Drop</span>
    </a>

    <div class="verify-icon" aria-hidden="true">✉</div>
    <div class="eyebrow">Email verification</div>
    <h1>Check your email.</h1>
    <p>We sent a verification link to the email address below. Open the email and click the verification link to activate your account.</p>
    <div class="email-box" id="email-display">your email address</div>

    <div id="status" class="auth-status" aria-live="polite"></div>

    <div class="verify-actions">
      <button id="resend" class="btn primary" type="button">Resend verification email</button>
      <a class="btn" href="sign-in.html" style="width:100%">Continue to Sign In</a>
    </div>
    <div class="timer" id="timer"></div>
    <a class="text-link" href="sign-up.html">Use a different email address</a>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-app.js"></script>
<script>
(async()=>{
  const status=document.getElementById("status");
  const emailDisplay=document.getElementById("email-display");
  const resend=document.getElementById("resend");
  const timer=document.getElementById("timer");
  const email=new URLSearchParams(location.search).get("email")?.trim()||"";

  function msg(text,type="info"){
    status.textContent=text;
    status.className="auth-status show "+type;
  }

  if(email){
    emailDisplay.textContent=email;
  }else{
    emailDisplay.textContent="the email address you used";
  }

  await initSupabase();
  await loadSiteBranding();
  const client=await initSupabase();

  let cooldown=0;
  let interval=null;

  function startCooldown(seconds=60){
    cooldown=seconds;
    resend.disabled=true;
    clearInterval(interval);
    const tick=()=>{
      if(cooldown<=0){
        clearInterval(interval);
        timer.textContent="";
        resend.disabled=false;
        resend.textContent="Resend verification email";
        return;
      }
      timer.textContent="You can request another email in "+cooldown+"s.";
      resend.textContent="Resend email ("+cooldown+"s)";
      cooldown--;
    };
    tick();
    interval=setInterval(tick,1000);
  }

  resend.addEventListener("click",async()=>{
    if(!email){msg("No email address was provided. Please create the account again from the sign-up page.","error");return;}
    if(!client){msg("Supabase is not configured. Please check your project configuration.","error");return;}
    resend.disabled=true;
    msg("Sending a new verification email…","info");
    try{
      const {error}=await client.auth.resend({type:"signup",email});
      if(error) throw error;
      msg("A new verification email has been sent. Check your inbox and spam folder.","success");
      startCooldown();
    }catch(err){
      console.error("Verification resend error:",err);
      msg(err?.message||"We could not resend the verification email. Please try again.","error");
      resend.disabled=false;
    }
  });
})();
</script>
</body>
</html>
