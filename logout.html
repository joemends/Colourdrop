<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log Out | Color Drop</title><link rel="stylesheet" href="css/style.css"><style>body{background:#f7f4fb}.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:30px}.auth-card{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:0 20px 60px rgba(0,0,0,.08)}.auth-logo{display:flex;align-items:center;gap:12px;font-weight:900;font-size:1.1rem;margin-bottom:30px}.auth-logo .logo-mark{width:42px;height:42px}.auth-card h1{font-size:2.5rem;margin-bottom:10px}.auth-card p{color:#666}.field{margin-top:18px}.field label{display:block;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:14px;border:1px solid var(--line);border-radius:10px;font:inherit}.auth-status{margin-top:16px;padding:12px 14px;border-radius:10px;display:none}.auth-status.show{display:block}.auth-status.error{background:#fff0f0;color:#b42318}.auth-status.success{background:#ecfdf3;color:#067647}.auth-links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px}.auth-links a{color:var(--primary);font-weight:700;text-decoration:none}.password-wrap{position:relative}.password-wrap input{padding-right:52px}.toggle-pass{position:absolute;right:8px;top:7px;border:0;background:transparent;padding:10px;cursor:pointer}</style></head><body><main class="auth-wrap"><section class="auth-card"><a class="auth-logo logo" href="index.html"><span class="logo-mark"></span><span data-site-name>Color Drop</span></a><div class="eyebrow">Session</div><h1>Signing out…</h1><p>Please wait while your account session is securely closed.</p><div id="status" class="auth-status show">Logging out…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/supabase-app.js"></script><script>(async()=>{try{const c=await initSupabase();if(c)await c.auth.signOut()}finally{location.replace("sign-in.html")}})()</script></body></html>
