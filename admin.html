<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Print Innovation Admin</title>
<link rel="stylesheet" href="css/style.css">
<style>
.admin-shell{padding:55px 0}.admin-top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:35px}.admin-nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:25px}.admin-nav button{border:1px solid var(--line);background:#fff;padding:12px 16px;border-radius:999px;cursor:pointer;font-weight:700}.admin-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.admin-table th,.admin-table td{text-align:left;padding:14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.85rem}.admin-table th{background:var(--soft)}.admin-card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;margin-bottom:25px}
</style>
</head>
<body data-admin="true">
<div class="topbar"><div class="container"><span>Print Innovation Admin</span><span data-user-email></span></div></div>
<header class="nav"><div class="container nav-inner"><a class="logo" href="index.html"><span class="logo-mark"></span>PRINT INNOVATION</a><button class="btn" onclick="signOut()">Sign out</button></div></header>
<main class="admin-shell"><div class="container">
<div class="admin-top"><div><div class="eyebrow">Dashboard</div><h1 style="font-size:3.5rem">Admin portal.</h1><p style="margin-top:10px">Manage enquiries and your website content through Supabase.</p></div></div>
<div class="admin-nav"><button onclick="document.getElementById('inquiries').scrollIntoView({behavior:'smooth'})">Enquiries</button><button onclick="document.getElementById('media').scrollIntoView({behavior:'smooth'})">Media</button></div>
<section id="inquiries" class="admin-card"><div class="eyebrow">Contact submissions</div><h2 style="font-size:2.5rem;margin-bottom:20px">Recent enquiries</h2>
<div style="overflow:auto"><table class="admin-table"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Service</th><th>Message</th><th>Date</th></tr></thead><tbody id="inquiries-body"><tr><td colspan="6">Loading…</td></tr></tbody></table></div></section>
<section id="media" class="admin-card"><div class="eyebrow">Storage</div><h2 style="font-size:2.5rem">Upload an image</h2><p style="margin:12px 0 20px">Uploads go to the <strong>site-images</strong> Supabase Storage bucket.</p>
<input id="admin-image" type="file" accept="image/*"><button class="btn primary" style="margin-top:15px" onclick="adminUpload()">Upload image</button><div id="upload-result" style="margin-top:15px"></div></section>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script><script src="js/supabase-app.js"></script>
<script>
async function adminUpload(){
 const input=document.getElementById('admin-image'), result=document.getElementById('upload-result');
 if(!input.files[0]){result.textContent='Choose an image first.';return;}
 result.textContent='Uploading…';
 try{const url=await uploadImage(input.files[0]); result.innerHTML='Uploaded: <a href="'+url+'" target="_blank">'+url+'</a>'; input.value='';}
 catch(e){console.error(e);result.textContent='Upload failed: '+(e.message||e);}
}
</script>
</body></html>
